plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The signing key must stay identical across builds. Android identifies an
// app by its signature, so signing an update with a different key makes it a
// different app and the install is refused with "App not installed".
//
// The debug keystore cannot serve that purpose: a CI runner has none, so the
// build tools mint a throwaway one on every run and no two releases could
// ever replace one another. Hence a fixed keystore committed with the source.
//
// That key and its password are public. It gives releases one identity; it
// proves nothing about who built them, and anyone can sign an APK that this
// installation would accept as an update. Set the KEYSTORE_* environment
// variables — the workflow fills them from repository secrets — to sign with
// a private key instead; those take precedence whenever they are present.
def envKeystore = System.getenv("KEYSTORE_FILE")
def usingEnvKeystore = envKeystore != null && !envKeystore.isEmpty() && file(envKeystore).exists()
def keystoreFile = usingEnvKeystore ? file(envKeystore) : file("peroma-release.jks")
def hasReleaseKeystore = keystoreFile.exists()

android {
    namespace 'de.peroma.voice'
    compileSdk 34

    defaultConfig {
        applicationId "de.peroma.voice"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "2.3.0"
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile keystoreFile
                storePassword usingEnvKeystore ? System.getenv("KEYSTORE_PASSWORD") : "peromavoice"
                keyAlias usingEnvKeystore ? System.getenv("KEY_ALIAS") : "peroma"
                keyPassword usingEnvKeystore ? System.getenv("KEY_PASSWORD") : "peromavoice"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
}
