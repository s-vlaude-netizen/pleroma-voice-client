plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The signing key must stay identical across builds. Android identifies an
// app by its signature, so signing an update with a different key makes it a
// different app and the install is refused with "App not installed".
//
// The debug keystore cannot serve that purpose: a CI runner has none, so the
// build tools mint a throwaway one on every run and no two releases could
// ever replace one another. Hence a fixed keystore committed with the source.
//
// That key and its password are public. It gives releases one identity; it
// proves nothing about who built them, and anyone can sign an APK that this
// installation would accept as an update. Set the KEYSTORE_* environment
// variables — the workflow fills them from repository secrets — to sign with
// a private key instead; those take precedence whenever they are present.
def envKeystore = System.getenv("KEYSTORE_FILE")
def usingEnvKeystore = envKeystore != null && !envKeystore.isEmpty() && file(envKeystore).exists()
def keystoreFile = usingEnvKeystore ? file(envKeystore) : file("peroma-release.jks")
def hasReleaseKeystore = keystoreFile.exists()

// The speech engine: transcribe.cpp, the library behind Handy
// (https://handy.computer), MIT licensed. It is downloaded rather than copied
// into this repository, from the crate that Handy itself builds against, and
// checked against a fixed hash so the build cannot silently pick up other code.
def transcribeVersion = '0.4.2'
def transcribeSha256 = '32f94fb1e9a3033101bbd500d02993cfc95e315f24417038fd42f1fd80e1059a'
def transcribeRoot = layout.buildDirectory.dir('transcribe-src').get().asFile
def transcribeSrc = new File(transcribeRoot, "transcribe-cpp-sys-${transcribeVersion}")

tasks.register('fetchTranscribe') {
    outputs.dir(transcribeSrc)
    onlyIf { !new File(transcribeSrc, 'CMakeLists.txt').exists() }
    doLast {
        def archive = new File(transcribeRoot, "transcribe-cpp-sys-${transcribeVersion}.crate")
        transcribeRoot.mkdirs()
        new URL("https://static.crates.io/crates/transcribe-cpp-sys/transcribe-cpp-sys-${transcribeVersion}.crate")
            .withInputStream { input -> archive.withOutputStream { it << input } }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
            .digest(archive.bytes).collect { String.format('%02x', it) }.join()
        if (digest != transcribeSha256) {
            archive.delete()
            throw new GradleException("transcribe-cpp-sys checksum mismatch: got ${digest}")
        }
        copy {
            from tarTree(resources.gzip(archive))
            into transcribeRoot
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('configureCMake') || task.name.startsWith('buildCMake')) {
        task.dependsOn 'fetchTranscribe'
    }
}

android {
    namespace 'de.peroma.voice'
    compileSdk 34

    defaultConfig {
        applicationId "de.peroma.voice"
        minSdk 24
        targetSdk 34
        versionCode 21
        versionName "2.10.1"

        ndk {
            // 64-bit ARM covers every phone that can run the speech model at a
            // usable speed. Add "x86_64" here to run it in an emulator.
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DTRANSCRIBE_SRC=${transcribeSrc}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    ndkVersion '26.1.10909125'

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile keystoreFile
                storePassword usingEnvKeystore ? System.getenv("KEYSTORE_PASSWORD") : "peromavoice"
                keyAlias usingEnvKeystore ? System.getenv("KEY_ALIAS") : "peroma"
                keyPassword usingEnvKeystore ? System.getenv("KEY_PASSWORD") : "peromavoice"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    testOptions {
        unitTests.all {
            // Lets LocalSttModelTest load a desktop build of the JNI library.
            def libDir = System.getenv('PEROMA_STT_LIB_DIR')
            if (libDir) jvmArgs "-Djava.library.path=${libDir}"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
}
