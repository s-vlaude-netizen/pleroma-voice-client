name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the APK as a GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Using the repository release keystore."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret set — the APK will be signed with the debug key."
          fi

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: apk
        run: |
          VERSION="$(grep -oP 'versionName "\K[^"]+' app/build.gradle)"
          SRC="app/build/outputs/apk/release/app-release.apk"
          DEST="peroma-voice-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "name=$DEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: peroma-voice-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-build{1}', steps.apk.outputs.version, github.run_number) }}
          name: Peroma Voice ${{ steps.apk.outputs.version }}
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
          body: |
            **Peroma Voice** — reiner Audio-Client für Pleroma.

            Lade die APK unten herunter und installiere sie auf deinem Android-Gerät
            (Android 7.0 oder neuer). Dafür muss die Installation aus unbekannten
            Quellen für den Browser bzw. die Dateiverwaltung erlaubt sein.
